# Shared by both containers: same image, config, credentials and database.
x-agent: &agent
  build: .
  image: dca-agent:local
  # Comes back after crashes and Docker restarts. Docker Desktop itself must be set to
  # "Start when you sign in" for this to survive a laptop reboot.
  restart: unless-stopped
  env_file: .env                     # ANGEL_* credentials, optional N8N_WEBHOOK_URL
  environment:                       # soak config; these override .env
    DCA_DB: /state/equity_dca.db
    DEPLOY_MODE: schedule
    DCA_START: "8000"
    DCA_AMOUNT: "500"
    PAPER_CASH: "8000"               # simulated cash for the unfunded paper soak; delete once funded
  volumes:
    - dca-state:/state               # SQLite: orders, snapshots, last-buy week
    - dca-data:/app/data             # Angel scrip master cache (34MB, fetched once)
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  dca:                               # the agent: hourly paper loop, can't place orders
    <<: *agent
    container_name: dca-agent

  status:                            # read-only status page for your phone
    <<: *agent
    container_name: dca-status
    command: ["python", "equity_agent/dca_agent.py", "--serve"]
    ports:
      - "127.0.0.1:8080:8080"        # this laptop only; reach it from the iPhone via Tailscale

volumes:
  dca-state:
  dca-data:
